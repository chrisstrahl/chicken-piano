<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffd84d">
<title>Chicken Piano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#9fdcff; --bg2:#fff3c4; --grass:#8bd450; --grass2:#6cbf3a;
  --card:#ffffff; --ink:#3b2716; --muted:#8c7356; --accent:#ff8a1f; --accent-d:#d96a00;
  --yolk:#ffd84d; --yolk-d:#e0b52a; --good:#3ccf6e; --bad:#ff5a5a; --barn:#e2483d; --barn-d:#b8322a;
  --sky-btn:#46b4ff; --sky-btn-d:#2a8fd6; --violet:#9b6bff; --violet-d:#7447d9;
  --white-key:#fffdf8; --black-key:#2a211b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#1d2550; --bg2:#3a2e5c; --grass:#3d7a2a; --grass2:#2f6220;
    --card:#fffaf0; --ink:#3b2716;
  }
}
:root[data-theme="dark"]{ --bg1:#1d2550; --bg2:#3a2e5c; --grass:#3d7a2a; --grass2:#2f6220; --card:#fffaf0; --ink:#3b2716; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  font-family:'Fredoka',ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif;
  color:var(--ink);background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.screen{position:fixed;inset:0;display:none;flex-direction:column;
  padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.screen.active{display:flex}

/* chunky buttons */
.btn{background:var(--yolk);box-shadow:0 5px 0 var(--yolk-d);border-radius:18px;padding:8px 14px;font-weight:700;
  font-size:clamp(16px,2.4vw,24px);display:inline-flex;align-items:center;gap:8px;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--yolk-d)}
.btn.round{width:clamp(44px,7vh,60px);height:clamp(44px,7vh,60px);padding:0;justify-content:center;border-radius:50%;font-size:clamp(20px,3.6vh,30px)}
.btn.off{filter:grayscale(1) opacity(.55)}
.btn.orange{background:var(--accent);box-shadow:0 5px 0 var(--accent-d);color:#fff}
.btn.red{background:var(--barn);box-shadow:0 5px 0 var(--barn-d);color:#fff}
.btn.blue{background:var(--sky-btn);box-shadow:0 5px 0 var(--sky-btn-d);color:#fff}
.btn.violet{background:var(--violet);box-shadow:0 5px 0 var(--violet-d);color:#fff}
.btn.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}

.topbar{display:flex;align-items:center;gap:10px;min-height:clamp(48px,9vh,68px);padding-right:clamp(150px,22vw,230px)}
.topbar h2{margin:0;font-size:clamp(18px,3.4vh,30px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;
  color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}

/* mic pill (global) */
#mic{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:50;
  height:clamp(44px,7vh,60px);border-radius:999px;padding:0 16px 0 10px;display:flex;align-items:center;gap:8px;
  background:var(--barn);color:#fff;box-shadow:0 5px 0 var(--barn-d);font-weight:700;font-size:clamp(15px,2.2vw,20px)}
#mic .ic{font-size:1.5em}
#mic .lvl{width:46px;height:12px;border-radius:6px;background:rgba(255,255,255,.35);overflow:hidden;display:none}
#mic .lvl i{display:block;height:100%;width:0;background:#fff;border-radius:6px;transition:width .06s}
#mic .heard{display:none;min-width:34px;height:34px;border-radius:50%;background:#fff;color:var(--ink);align-items:center;justify-content:center;font-size:20px}
#mic.on{background:var(--good);box-shadow:0 5px 0 #26a352}
#mic.on .lvl{display:block}
#mic.on .heard{display:flex}
#mic.on .txt{display:none}
#mic:active{transform:translateY(3px)}
#mic.nudge{animation:pulse 1s ease-in-out 3}

/* chicken */
.chicken{display:block;overflow:visible}
.chicken .ck-all{transform-origin:60px 118px;transform-box:view-box}
.chicken .ck-body{transform-origin:60px 112px;transform-box:view-box;animation:bob 2.2s ease-in-out infinite}
.chicken .ck-eyes{transform-origin:60px 58px;transform-box:view-box;animation:blink 4.5s infinite}
.chicken .ck-wl{transform-origin:30px 62px;transform-box:view-box}
.chicken .ck-wr{transform-origin:90px 62px;transform-box:view-box}
@keyframes bob{50%{transform:translateY(-2px) scaleY(1.02)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.chicken.happy .ck-all{animation:hop .55s ease-out}
.chicken.happy .ck-wl{animation:flapL .12s 4 alternate}
.chicken.happy .ck-wr{animation:flapR .12s 4 alternate}
.chicken.peck .ck-all{animation:peck .28s ease-in-out}
.chicken.oops .ck-all{animation:tilt .7s ease-in-out}
.chicken.dance .ck-all{animation:dance .6s ease-in-out infinite}
.chicken.dance .ck-wl{animation:flapL .15s infinite alternate}
.chicken.dance .ck-wr{animation:flapR .15s infinite alternate}
@keyframes hop{35%{transform:translateY(-22px)}70%{transform:translateY(0) scaleY(.92)}}
@keyframes flapL{to{transform:rotate(40deg)}}
@keyframes flapR{to{transform:rotate(-40deg)}}
@keyframes peck{50%{transform:rotate(14deg) translateY(4px)}}
@keyframes tilt{25%{transform:rotate(-12deg)}60%{transform:rotate(10deg)}}
@keyframes dance{25%{transform:rotate(-10deg) translateY(-6px)}75%{transform:rotate(10deg) translateY(-6px)}}

/* HOME */
#home{align-items:center;justify-content:center;gap:2vh;background:
  radial-gradient(ellipse 120% 40% at 50% 112%,var(--grass) 60%,transparent 61%)}
#home .hero{display:flex;align-items:center;gap:3vw}
#home .hero .chicken{height:min(30vh,34vw)}
#home h1{margin:0;font-size:min(11vh,9vw);line-height:.95;color:#fff;text-shadow:0 4px 0 var(--accent-d),0 8px 18px rgba(0,0,0,.18);letter-spacing:.5px}
#home h1 span{display:block;color:var(--yolk);text-shadow:0 4px 0 var(--yolk-d),0 8px 18px rgba(0,0,0,.18)}
.menu{display:flex;gap:3vw}
.menu .tile{width:min(24vw,30vh);aspect-ratio:1;border-radius:28px;flex-direction:column;justify-content:center;gap:.4vh;
  font-size:min(4.2vh,3.4vw)}
.menu .tile .em{font-size:min(13vh,10vw);line-height:1}
.coop{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.8);border-radius:999px;padding:6px 18px;font-size:min(4vh,3vw);min-height:44px}
#home .ver{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(6px,env(safe-area-inset-bottom));font-size:11px;color:rgba(0,0,0,.4)}
.coop .lbl{font-weight:700;margin-right:6px}

/* SONGS / LESSONS lists */
.cards{flex:1;display:flex;gap:2.5vw;align-items:center;justify-content:center;padding:1vh 0 2vh}
.card{background:var(--card);border-radius:28px;box-shadow:0 7px 0 rgba(0,0,0,.14);width:min(29vw,46vh);height:min(66vh,48vw);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:2.6vh 1.6vw;text-align:center;transition:transform .1s}
.card:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
.card .em{font-size:min(15vh,11vw);line-height:1}
.card .t{font-size:min(4.6vh,3.1vw);font-weight:700;line-height:1.05}
.card .s{font-size:min(2.8vh,1.9vw);color:var(--muted)}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots b{width:min(5vh,3.4vw);height:min(5vh,3.4vw);border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:min(3vh,2vw);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.eggs{font-size:min(6vh,4.4vw);letter-spacing:2px}
.eggs .no{filter:grayscale(1) opacity(.25)}
.done-badge{font-size:min(6vh,4.4vw)}
.card.locked{filter:grayscale(.9);opacity:.6}

/* level map: two rows of five, a winding path */
.map{flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr;gap:2.4vh 2vw;padding:1vh 2vw 3vh;align-items:center;justify-items:center}
.map .node:nth-child(n+6){grid-row:2}
.map .node:nth-child(6){grid-column:5}.map .node:nth-child(7){grid-column:4}.map .node:nth-child(8){grid-column:3}.map .node:nth-child(9){grid-column:2}.map .node:nth-child(10){grid-column:1}
.node{position:relative;width:min(17vw,34vh);aspect-ratio:1;border-radius:50%;background:var(--lc);color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4vh;transition:transform .1s}
.node:active{transform:translateY(5px)}
.node .num{position:absolute;top:-4px;left:-4px;width:min(6vw,10vh);height:min(6vw,10vh);border-radius:50%;background:#fff;color:var(--ink);
  font-weight:700;font-size:min(3.4vw,5.4vh);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.node .em{font-size:min(7vw,12vh);line-height:1}
.node .nm{font-size:min(1.9vw,3.1vh);font-weight:700;text-align:center;line-height:1;padding:0 8px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.node .pips{display:flex;gap:4px}
.node .pips i{width:min(1.6vw,2.6vh);height:min(1.6vw,2.6vh);border-radius:50%;background:rgba(255,255,255,.4)}
.node .pips i.on{background:#fff}
.node.later{filter:saturate(.45);opacity:.8}
.node.done{box-shadow:0 7px 0 rgba(0,0,0,.2),0 0 0 5px #ffd84d}
.node.done .num{background:var(--yolk)}
.node.here{transform:scale(1.12);box-shadow:0 7px 0 rgba(0,0,0,.2),0 0 0 6px #fff;animation:pulse 1.6s ease-in-out infinite}
.node.here:after{content:"🐔";position:absolute;right:-6%;bottom:-6%;font-size:min(6vw,10vh);animation:hopK .9s ease-in-out infinite}
.node.oops{animation:shake .4s}
.stars{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.75);border-radius:999px;padding:6px 14px}
.stars i{width:min(2.4vw,3.6vh);height:min(2.4vw,3.6vh);border-radius:50%;background:rgba(0,0,0,.12)}
.stars i.on{background:var(--lc)}
.stars i.cur{background:#fff;box-shadow:0 0 0 3px var(--lc)}
.stars b{margin-left:6px;font-size:min(2.6vw,3.8vh);white-space:nowrap}
.tile{position:relative}
.tbadge{position:absolute;top:-10px;right:-10px;background:#fff;color:var(--ink);border-radius:999px;padding:2px 10px;font-size:.8em;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.card.lesson.done{background:#eefbe9}
.keybtn{margin-left:auto;opacity:.5;transition:background .2s}
.keybtn.on{opacity:1}
.keybtn.holding{background:var(--good);transition:background 2s}

/* one level */
.lvbody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2.6vh;padding-bottom:2vh;min-height:0}
.lvsec{display:flex;align-items:center;gap:1.4vw}
.lvlbl{font-size:min(7vh,5vw);width:min(8vh,6vw);text-align:center}
.lvrowc{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:1.4vw}
#levelLessons{grid-template-columns:repeat(4,1fr)}
.lvrowc .card{width:auto;height:min(34vh,22vw);padding:1.4vh .8vw;gap:.4vh;justify-content:center}
.lvrowc .card .em{font-size:min(10vh,6.4vw)}
.lvrowc .card .t{font-size:min(3.2vh,2vw)}
.lvrowc .card .badge{font-size:min(5vh,3.4vw);min-height:1em}
.lvrowc .eggs{font-size:min(4vh,2.8vw)}
.card.lesson{border-bottom:8px solid var(--lc)}
.card.next{animation:pulse 1.4s ease-in-out infinite}

/* all songs, by level */
.songlist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:1.6vh;padding:1vh 4px 3vh;-webkit-overflow-scrolling:touch}
.lvrow{display:grid;grid-template-columns:min(9vh,6vw) repeat(5,1fr);gap:1.2vw;align-items:stretch}
.lvtag{border-radius:20px;background:var(--lc);color:#fff;font-weight:700;font-size:min(5vh,3.4vw);display:flex;flex-direction:column;align-items:center;justify-content:center}
.lvtag small{font-size:.7em}
.lvrow .card{width:auto;height:auto;padding:1.4vh .6vw;gap:.4vh;justify-content:center}
.lvrow .card .em{font-size:min(8vh,5.4vw)}
.lvrow .card .t{font-size:min(2.8vh,1.8vw)}
.lvrow .eggs{font-size:min(3.6vh,2.5vw)}

/* PLAY / LESSON layout */
.stage{flex:1;display:flex;flex-direction:column;gap:1vh;min-height:0}
.staffcard{background:var(--card);border-radius:22px;box-shadow:0 5px 0 rgba(0,0,0,.12);flex:1 1 0;min-height:0;position:relative;overflow:hidden}
.staffcard .scroller{position:absolute;inset:0;overflow:hidden}
.staffcard .strip{position:absolute;left:0;top:0;height:100%;transition:transform .45s cubic-bezier(.3,1.3,.5,1);will-change:transform}
.staffcard .strip svg{display:block;height:100%;width:auto}
.staffcard.static .strip{position:absolute;inset:0;width:100%;transform:none!important}
.staffcard.static .strip svg{width:100%;height:100%}
.staffcard .cur{fill:#ffe48a;opacity:.75;rx:14px}
.staffcard .vf-stavenote.done{opacity:.28}
.staffcard .lt{font-weight:700;font-family:'Fredoka',sans-serif}
.staffcard .ly{font-family:'Fredoka',sans-serif;fill:var(--muted);font-weight:600}
.staffcard .ly.done,.staffcard .ltg.done{opacity:.3}
.staffcard .dim{opacity:.3}
.staffcard .chordsym{font-family:'Fredoka',sans-serif;font-weight:700;fill:#7447d9}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.coach{display:flex;align-items:center;gap:1.4vw;min-height:clamp(54px,13vh,110px);flex:0 0 auto}
.coach .chicken{height:clamp(54px,13vh,110px);flex:0 0 auto}
.bubble{background:#fff;border-radius:24px;padding:.6vh 22px;position:relative;font-weight:700;font-size:clamp(18px,4.2vh,36px);
  display:flex;align-items:center;gap:12px;min-height:clamp(46px,10vh,86px);box-shadow:0 4px 0 rgba(0,0,0,.1);max-width:60%}
.bubble:before{content:"";position:absolute;left:-14px;top:50%;margin-top:-12px;border:12px solid transparent;border-right-color:#fff;border-left:0}
.bubble .big{width:clamp(40px,8.5vh,74px);height:clamp(40px,8.5vh,74px);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:clamp(26px,6vh,52px);color:#fff;text-shadow:0 2px 2px rgba(0,0,0,.3);flex:0 0 auto}
.bubble .egg0{font-style:normal;filter:grayscale(1) opacity(.3)}
.coop .cnt{font-weight:700;margin-right:10px;white-space:nowrap}
.bubble .goal{font-size:.8em;letter-spacing:2px;white-space:nowrap}
.bubble .ask{font-size:1.3em}
.bubble .big.blk{font-size:clamp(20px,4.6vh,40px)}
.bubble.pop{animation:bpop .3s}
@keyframes bpop{50%{transform:scale(1.08)}}
.coach .spacer{flex:1}
.coach .tools{display:flex;gap:10px;align-items:center}
.progress{height:14px;border-radius:7px;background:rgba(255,255,255,.6);overflow:hidden;width:min(24vw,240px)}
.progress i{display:block;height:100%;width:0;background:var(--good);transition:width .3s}

/* KEYBOARD */
.kbwrap{flex:0 0 38%;min-height:120px;position:relative}
.kb{position:absolute;inset:0;display:flex;border-radius:16px 16px 10px 10px;overflow:hidden;background:#3b2716;padding:6px 4px 4px;gap:3px;--bw:6%}
.wkey{flex:1;background:var(--white-key);border-radius:0 0 12px 12px;position:relative;display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:1.2vh;box-shadow:inset 0 -8px 0 rgba(0,0,0,.08);transition:background .12s}
.wkey .kl{width:clamp(28px,6vh,52px);height:clamp(28px,6vh,52px);border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;
  font-weight:700;color:#fff;font-size:clamp(16px,3.8vh,32px);text-shadow:0 1px 2px rgba(0,0,0,.35);transition:opacity .2s}
.kb[data-letters="none"] .kl{opacity:0}
.kb[data-letters="hl"] .wkey:not(.hl):not(.target) .kl{opacity:0}
.bkey{position:absolute;top:6px;width:var(--bw);height:58%;background:var(--black-key);border-radius:0 0 8px 8px;z-index:2;
  box-shadow:inset 0 -6px 0 rgba(255,255,255,.12)}
.wkey.down,.wkey.held{background:#ffe9a8}
.bkey.down,.bkey.held{background:#6a5444}
.wkey.target{background:var(--c);animation:glow 1s ease-in-out infinite}
.wkey.target .kl{background:#fff;color:var(--ink);text-shadow:none}
.wkey.target:after{content:"🐣";position:absolute;top:10%;font-size:clamp(22px,5vh,44px);animation:hopK .8s ease-in-out infinite}
@keyframes hopK{50%{transform:translateY(-8px)}}
@keyframes glow{50%{box-shadow:inset 0 0 0 6px rgba(255,255,255,.75)}}
.wkey.hl{background:color-mix(in srgb,var(--c) 45%,white)}
.wkey.good{background:var(--good)!important}
.wkey.bad,.bkey.bad{background:#ffb3b3!important}
.bkey.hl{background:var(--violet)}
.bkey.target{background:var(--violet);animation:glow 1s ease-in-out infinite}
.bkey.target:after{content:"🐣";position:absolute;left:50%;bottom:8%;transform:translateX(-50%);font-size:clamp(16px,3.6vh,32px)}
.bkey.good{background:var(--good)!important}
.fg{position:absolute;top:8%;left:50%;transform:translateX(-50%);font-weight:700;font-size:clamp(16px,3.6vh,30px);color:var(--ink)}
.bkey .fg{color:#fff;font-size:clamp(12px,2.6vh,22px)}
.mid{position:absolute;bottom:calc(1.2vh + clamp(28px,6vh,52px) + 2px);font-size:clamp(10px,2vh,16px)}
.kb.many .wkey .kl{width:clamp(20px,4.6vh,40px);height:clamp(20px,4.6vh,40px);font-size:clamp(12px,2.8vh,24px)}
.kb.many .wkey .mid{bottom:calc(1.2vh + clamp(20px,4.6vh,40px) + 2px)}
.kb.bgroups .bkey{background:var(--violet)}
.kb.bgroups .bkey[data-g="3"]{background:var(--accent)}

/* lesson extras: keyboard sits at the bottom, and grows when there's no music to show */
#lesson .kbwrap{margin-top:auto}
#lessonStaff[style*="none"] ~ .kbwrap{flex-basis:56%}
#lessonStaff[style*="none"] ~ .choices{flex:1}
.choices{display:flex;gap:2vw;justify-content:center;align-items:center;flex:0 0 auto;padding:1vh 0 2vh}
.choice{width:min(18vw,22vh);height:min(22vw,26vh);border-radius:50% 50% 46% 46% / 58% 58% 42% 42%;background:#fffaf0;
  box-shadow:0 6px 0 #e7d9bd;font-size:min(10vh,7vw);font-weight:700;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1}
.choice small{font-size:.35em;color:var(--muted)}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 #e7d9bd}
.choice.wide{width:min(26vw,30vh);font-size:min(7vh,5vw)}
.choice.right{background:var(--good);color:#fff}
.choice.wrong{animation:shake .4s;background:#ffd0d0}
.stepdots{display:flex;gap:6px}
.stepdots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.55)}
.stepdots i.on{background:var(--yolk)}
.stepdots i.done{background:var(--good)}

/* celebrate overlay */
#ask{position:fixed;inset:0;z-index:85;display:none;align-items:center;justify-content:center;background:rgba(40,25,10,.45)}
#ask.show{display:flex}
#ask .box{background:var(--card);border-radius:32px;padding:3vh 4vw;display:flex;align-items:center;gap:3vw;box-shadow:0 10px 0 rgba(0,0,0,.2);animation:bpop .3s}
#ask .chicken{height:min(26vh,22vw)}
#ask .right{display:flex;flex-direction:column;align-items:center;gap:2.4vh}
#ask h3{margin:0;font-size:min(9vh,7vw)}
#ask .row{display:flex;gap:4vw}
#ask .btn.round{width:min(14vh,11vw);height:min(14vh,11vw);font-size:min(7vh,5.4vw)}
#party{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(40,25,10,.45)}
#party.show{display:flex}
#party .box{background:var(--card);border-radius:32px;padding:3vh 4vw;display:flex;align-items:center;gap:3vw;box-shadow:0 10px 0 rgba(0,0,0,.2);animation:bpop .4s}
#party .chicken{height:min(36vh,30vw)}
#party .right{display:flex;flex-direction:column;align-items:center;gap:2vh}
#party .eggs{font-size:min(12vh,9vw)}
#party .eggs span{display:inline-block;animation:eggIn .5s backwards}
#party .eggs span:nth-child(2){animation-delay:.35s}
#party .eggs span:nth-child(3){animation-delay:.7s}
@keyframes eggIn{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.25)}}
#party h3{margin:0;font-size:min(8vh,6vw);color:var(--accent)}
#party .row{display:flex;gap:14px}
.confetti{position:fixed;top:-60px;z-index:90;font-size:34px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}

#start{position:fixed;inset:0;z-index:120;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;
  background:radial-gradient(circle at 50% 45%,#fff6c9,var(--yolk) 70%);cursor:pointer}
#start .egg{font-size:min(40vh,40vw);line-height:1;animation:wobble 1.4s ease-in-out infinite}
#start .tap{font-size:min(12vh,12vw);animation:hopK .9s ease-in-out infinite}
#start.hatch{animation:fadeOut .7s forwards}
#start.hatch .egg{animation:crack .5s forwards}
@keyframes wobble{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-12deg)}80%{transform:rotate(10deg)}90%{transform:rotate(-6deg)}}
@keyframes crack{50%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(0) rotate(-30deg)}}
@keyframes fadeOut{to{opacity:0}}
.coop{cursor:pointer}
#toast{position:fixed;left:50%;bottom:4vh;transform:translateX(-50%) translateY(150%);background:#3b2716;color:#fff;padding:12px 20px;border-radius:16px;
  font-size:18px;z-index:99;max-width:min(90vw,560px);text-align:center;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}

#turn{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:var(--yolk);font-size:28px;font-weight:700;text-align:center;padding:16px}
#turn .em{font-size:90px;animation:spin 2s ease-in-out infinite}
@keyframes spin{50%{transform:rotate(90deg)}}
@media (orientation:portrait) and (max-width:700px){#turn{display:flex}}
</style>
</head>
<body>

<div id="start"><div class="egg">🥚</div><div class="tap">👆</div></div>

<button id="mic" aria-label="Microphone"><span class="ic">🎤</span><span class="txt">Ears</span><span class="lvl"><i></i></span><span class="heard">·</span></button>

<section id="home" class="screen active">
  <div class="hero">
    <div data-chicken></div>
    <h1>Chicken<span>Piano</span></h1>
  </div>
  <div class="menu">
    <button class="btn blue tile" data-go="map"><span class="em">🗺️</span>Levels<span class="tbadge" id="homeLevel"></span></button>
    <button class="btn orange tile" data-go="songs"><span class="em">🎵</span>Songs</button>
    <button class="btn violet tile" data-go="free"><span class="em">🎹</span>Play</button>
  </div>
  <div class="coop" id="coop"></div>
  <div class="ver">v <!--VERSION--></div>
</section>

<section id="songs" class="screen">
  <div class="topbar"><button class="btn round" data-go="home" aria-label="Home">🏠</button><h2>🎵 Songs</h2></div>
  <div class="songlist" id="songCards"></div>
</section>

<section id="map" class="screen">
  <div class="topbar"><button class="btn round" data-go="home" aria-label="Home">🏠</button><h2>🗺️ Levels</h2>
    <div class="stars" id="mapStars"></div>
    <button class="btn round keybtn" id="btnKey" aria-label="Grown-ups: hold to open all levels">🔑</button></div>
  <div class="map" id="mapNodes"></div>
</section>

<section id="level" class="screen">
  <div class="topbar"><button class="btn round" data-go="map" aria-label="Back">⬅️</button><h2 id="levelTitle">Level</h2>
    <button class="btn round" id="levelPrev" aria-label="Easier level">◀️</button><button class="btn round orange" id="levelNext" aria-label="Next level">▶️</button></div>
  <div class="lvbody">
    <div class="lvsec"><span class="lvlbl">🥚</span><div class="lvrowc" id="levelLessons"></div></div>
    <div class="lvsec"><span class="lvlbl">🎵</span><div class="lvrowc" id="levelSongs"></div></div>
  </div>
</section>

<section id="play" class="screen">
  <div class="topbar">
    <button class="btn round" id="btnPlayBack" aria-label="Back">⬅️</button>
    <h2 id="playTitle">Song</h2>
    <div class="progress"><i id="playProg"></i></div>
  </div>
  <div class="stage">
    <div class="staffcard" id="playStaff"><div class="scroller"><div class="strip"></div></div></div>
    <div class="coach">
      <div data-chicken id="playChicken"></div>
      <div class="bubble" id="playBubble"></div>
      <div class="spacer"></div>
      <div class="tools">
        <button class="btn round blue" id="btnListen" aria-label="Listen">👂</button>
        <button class="btn round" id="btnRestart" aria-label="Restart">🔁</button>
        <button class="btn round" id="btnHands" aria-label="Which hand">🫱</button>
        <button class="btn round" id="btnLetters" aria-label="Letters">🔤</button>
      </div>
    </div>
    <div class="kbwrap"><div id="playKb"></div></div>
  </div>
</section>

<section id="lesson" class="screen">
  <div class="topbar">
    <button class="btn round" id="btnLessonBack" aria-label="Back">⬅️</button>
    <h2 id="lessonTitle">Lesson</h2>
    <div class="stepdots" id="lessonDots"></div>
  </div>
  <div class="stage">
    <div class="coach">
      <div data-chicken id="lessonChicken"></div>
      <div class="bubble" id="lessonBubble"></div>
      <div class="spacer"></div>
      <div class="tools">
        <button class="btn round blue" id="btnSay" aria-label="Say again">🔊</button>
        <button class="btn round blue" id="btnHear" aria-label="Hear it">🎵</button>
        <button class="btn orange pulse" id="btnNext" aria-label="Next" style="font-size:clamp(24px,5vh,40px);padding:6px 26px">➡️</button>
      </div>
    </div>
    <div class="staffcard static" id="lessonStaff"><div class="scroller"><div class="strip"></div></div></div>
    <div class="choices" id="lessonChoices"></div>
    <div class="kbwrap"><div id="lessonKb"></div></div>
  </div>
</section>

<section id="free" class="screen">
  <div class="topbar"><button class="btn round" data-go="home" aria-label="Home">🏠</button><h2>🎹 Play!</h2></div>
  <div class="stage">
    <div class="staffcard static" id="freeStaff"><div class="scroller"><div class="strip"></div></div></div>
    <div class="coach">
      <div data-chicken id="freeChicken"></div>
      <div class="bubble" id="freeBubble"></div>
    </div>
    <div class="kbwrap"><div id="freeKb"></div></div>
  </div>
</section>

<div id="party"><div class="box">
  <div data-chicken id="partyChicken"></div>
  <div class="right">
    <h3 id="partyTitle">BAWK!</h3>
    <div class="eggs" id="partyEggs"></div>
    <div class="row">
      <button class="btn round" id="partyAgain" aria-label="Again">🔁</button>
      <button class="btn round" id="partyHome" aria-label="Home">🏠</button>
      <button class="btn orange" id="partyNext" style="font-size:clamp(24px,5vh,40px);padding:6px 26px" aria-label="Next">➡️</button>
    </div>
  </div>
</div></div>

<div id="ask"><div class="box">
  <div data-chicken></div>
  <div class="right">
    <h3 id="askText">?</h3>
    <div class="row">
      <button class="btn round red" id="askNo" aria-label="No">✖️</button>
      <button class="btn round" id="askYes" aria-label="Yes" style="background:var(--good);box-shadow:0 5px 0 #26a352">✔️</button>
    </div>
  </div>
</div></div>

<div id="toast"></div>
<div id="turn"><div class="em">📱</div>Turn me sideways!</div>

<!--APP-->
</body>
</html>
